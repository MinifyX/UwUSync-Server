# `cargo audit` reads this.
[advisories]
ignore = [
    # rsa (Marvin attack, no fixed release). Only in the dependency tree of the tests: the UwUSSH
    # client crates that tests/client.rs runs against this server bring UwULock's client along.
    # Nothing of it is in the server binary. `cargo tree -i rsa -e normal` stays empty.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 (timing variability; fixed only in 0.7, which p256 0.13 does not take).
    # Likewise only in the tests' tree, through UwULock's client: `cargo tree -i crypto-bigint
    # -e normal` stays empty.
    "RUSTSEC-2026-0387",
]
