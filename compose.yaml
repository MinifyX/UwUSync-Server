# UwUSync Server
#
# install.sh sets all of this up for you. By hand it is:
#
#   1. cp .env.example .env   and set UWUSYNC_PUBLIC to how your devices reach this machine
#   2. docker compose up -d
#   3. docker compose logs uwusync | grep uwu1_
#   4. paste that setup code into UwUSSH or UwURDP under Settings → Sync
#
# The next version: update.sh, next to this file. Everything that differs from one machine to
# the next lives in .env, so update.sh can put the next version's compose.yaml here.
#
# The whole story, with a reverse proxy, backups and updates: docs/deployment.md.

name: uwusync

services:
  uwusync:
    image: ghcr.io/minifyx/uwusync-server:${UWUSYNC_VERSION:-latest}
    container_name: uwusync
    restart: unless-stopped
    environment:
      UWUSYNC_PUBLIC: ${UWUSYNC_PUBLIC:?set UWUSYNC_PUBLIC in .env}
      UWUSYNC_REGISTRATION: ${UWUSYNC_REGISTRATION:-invite}
      UWUSYNC_TLS: ${UWUSYNC_TLS:-auto}
      UWUSYNC_TRUST_FORWARDED: ${UWUSYNC_TRUST_FORWARDED:-off}
      UWUSYNC_UPDATE_CHECK: ${UWUSYNC_UPDATE_CHECK:-on}
      UWUSYNC_MAX_ACCOUNTS: ${UWUSYNC_MAX_ACCOUNTS:-100}
      UWUSYNC_ACCOUNT_MAX_RECORDS: ${UWUSYNC_ACCOUNT_MAX_RECORDS:-100000}
      UWUSYNC_ACCOUNT_MAX_MB: ${UWUSYNC_ACCOUNT_MAX_MB:-256}
      UWUSYNC_SERVER_MAX_MB: ${UWUSYNC_SERVER_MAX_MB:-2048}
      UWUSYNC_TEAMS: ${UWUSYNC_TEAMS:-on}
      UWUSYNC_TEAM_CREATION: ${UWUSYNC_TEAM_CREATION:-all}
      UWUSYNC_MAX_TEAMS_PER_ACCOUNT: ${UWUSYNC_MAX_TEAMS_PER_ACCOUNT:-10}
      UWUSYNC_MAX_TEAM_MEMBERS: ${UWUSYNC_MAX_TEAM_MEMBERS:-50}
      UWUSYNC_MAX_CONNECTIONS: ${UWUSYNC_MAX_CONNECTIONS:-512}
      UWUSYNC_MAX_CONNECTIONS_PER_IP: ${UWUSYNC_MAX_CONNECTIONS_PER_IP:-32}
      UWUSYNC_UWUAUTH_CA: ${UWUSYNC_UWUAUTH_CA:-}
      # What counts as an update is what this machine follows.
      UWUSYNC_CHANNEL: ${UWUSYNC_VERSION:-latest}
    ports:
      - "${UWUSYNC_BIND:-8443}:8443"   # the devices, over the server's own TLS
    volumes:
      - uwusync-data:/data
    stop_grace_period: 10s
    # Docker keeps a container's log for ever unless told otherwise, and somebody knocking a few
    # hundred times a second writes a lot of it. Thirty megabytes, then the oldest goes.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Hardening: the server runs as an unprivileged user (uid 10001) on a read-only root file
    # system; only the data volume and a small /tmp are writable. It listens above 1024, so it
    # keeps no Linux capability at all.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  uwusync-data:
    # A server set up while it was UwUSSH Server keeps the volume it has: update.sh writes its
    # name, uwussh_uwussh-data, into .env as UWUSYNC_VOLUME. Everybody else gets the usual one.
    name: ${UWUSYNC_VOLUME:-uwusync_uwusync-data}
