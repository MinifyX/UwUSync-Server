[package]
name = "uwusync-server"
description = "Sync server for UwUSSH and UwURDP: an encrypted mailbox for hosts, keys and passwords"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwUSync-Server"
# Same floor as the client, so one protocol crate builds for both.
rust-version = "1.89"

[dependencies]
# The wire format, the clock and the conflict rule, straight from the client:
# one definition, so client and server cannot drift apart. Pinned to a commit —
# `cargo update -p uwussh-proto` after bumping this is a deliberate act.
uwussh-proto = { git = "https://github.com/MinifyX/UwUSSH-Client.git", rev = "0671b0a840cfa9c4ea11a841acb697f620f99479" }

axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
# The one trait behind the event stream.
futures-core = "0.3"
# Signatures for device login. Pure Rust, no C toolchain.
ed25519-dalek = "2"
parking_lot = "0.12"
rand = "0.8"
# Bundled SQLite, so the server never depends on whichever libsqlite3 is around.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
# The same hyper-util axum-server builds on, for its clock and its builder: what a
# connection may take before it has said what it wants.
hyper-util = { version = "0.1.18", features = ["tokio", "server-auto"] }
# The traits hyper and axum already build on, to count what a connection is
# answering until the last byte of the answer.
http-body = "1"
tower-service = "0.3"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging", "tls12"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
# Two clients, both on rustls with `ring` and a TLS configuration of their own:
# the health check, which only trusts this server's key, and the daily look at
# GitHub's releases, which trusts the usual roots.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
webpki-roots = "1.0.9"

[target.'cfg(unix)'.dependencies]
# umask, so nothing the server writes is readable by other users.
libc = "0.2"

[dev-dependencies]
# No TLS feature: the tests talk to a server on localhost over plain HTTP.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# The real client, so one test can drive both halves of the protocol against
# each other instead of trusting that they agree.
uwussh-store = { git = "https://github.com/MinifyX/UwUSSH-Client.git", rev = "0671b0a840cfa9c4ea11a841acb697f620f99479" }
uwussh-sync = { git = "https://github.com/MinifyX/UwUSSH-Client.git", rev = "0671b0a840cfa9c4ea11a841acb697f620f99479" }
uwussh-vault = { git = "https://github.com/MinifyX/UwUSSH-Client.git", rev = "0671b0a840cfa9c4ea11a841acb697f620f99479" }
zeroize = "1.9.0"
# Time that runs on by itself, for what waits half a minute.
tokio = { version = "1", features = ["test-util"] }
# An HTTP/2 client that answers pings by itself, for what an idle one gets.
hyper = { version = "1", features = ["client", "http2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
